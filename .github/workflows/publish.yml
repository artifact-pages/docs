# Publish the guide and architecture sites to https://artifact-pages.dev.
# Pull requests run a dry-run publish; merges to main publish both sites. A
# publish that changes nothing is a no-op. Page text
# search needs fulltext: true on every publish, or its data is withdrawn.
name: Publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name != 'pull_request' && 'production' || '' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [guide, architecture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish ${{ matrix.site }}
        id: publish
        uses: tasuku43/git-artifact-pages@v0.1.2
        with:
          site: ${{ matrix.site }}
          source: sites/${{ matrix.site }}
          # The deployed registry decides eligibility; this config locates it.
          config: github://tasuku43/artifact-pages-admin/artifact-pages.yaml
          fulltext: "true"
          dry-run: ${{ github.event_name == 'pull_request' }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Summarize
        env:
          SITE: ${{ matrix.site }}
          OUTCOME: ${{ steps.publish.outputs.outcome }}
          CHANGES: ${{ steps.publish.outputs.changes_json }}
        run: |
          echo "### $SITE: $OUTCOME ($(jq length <<<"$CHANGES") changes)" >> "$GITHUB_STEP_SUMMARY"
