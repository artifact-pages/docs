# Publish the guide and architecture sites to https://artifact-pages.dev.
# Pull requests that change a site or this workflow run a dry-run publish;
# main pushes and manual runs on main publish both sites. A publish that
# changes nothing is a no-op.
# Every publish also builds the page text search data.
name: Publish

on:
  pull_request:
    paths:
      - 'sites/**'
      - '.github/workflows/publish.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Credentials live in the production environment; pull requests (dry-run)
    # run without it.
    environment: ${{ github.event_name != 'pull_request' && 'production' || '' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [guide, architecture]
    steps:
      - name: Publish ${{ matrix.site }}
        uses: artifact-pages/publish-action@d59b7eceb7431c998bd2338eede1137081a141a2 # v0.1.0
        with:
          site: ${{ matrix.site }}
          # The deployed registry decides eligibility; this config locates it.
          config: github://artifact-pages/admin/artifact-pages.yaml
          # Publish only from main; pull requests and other refs are dry-runs.
          publish-on: |
            push:refs/heads/main
            workflow_dispatch:refs/heads/main
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
