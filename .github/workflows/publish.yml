# Publish the ja site to https://artifact-pages.dev.
# Pull requests that change a site or this workflow run a dry-run publish;
# main pushes and manual runs on main publish every site. A publish that
# changes nothing is a no-op.
# Every publish also builds the page text search data.
name: Publish

on:
  pull_request:
    paths:
      - 'sites/**'
      - '.github/workflows/publish.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [ja]
    uses: artifact-pages/admin/.github/workflows/publish-site.yml@main
    with:
      site: ${{ matrix.site }}
      # The admin workflow selects production only for non-PR events; its
      # publish-on guard keeps PRs read-only and allows writes only from main.
      environment: ${{ github.event_name != 'pull_request' && 'production' || '' }}
    secrets: inherit
