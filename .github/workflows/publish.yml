# Publish the guide and architecture sites to https://artifact-pages.dev.
# Pull requests that change a site or this workflow run a dry-run publish;
# merges to main publish both sites. A publish that changes nothing is a no-op.
# Every publish also builds the page text search data.
name: Publish

on:
  pull_request:
    paths:
      - 'sites/**'
      - '.github/workflows/publish.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [guide, architecture]
    steps:
      # Short-lived (1 hour) installation token scoped to this job's needs;
      # it is revoked when the job ends. The workflow token is used only for
      # checkout and shallow deepening.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ARTIFACT_PAGES_APP_ID }}
          private-key: ${{ secrets.ARTIFACT_PAGES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: artifact-pages-admin
          permission-contents: read
      - name: Publish ${{ matrix.site }}
        uses: tasuku43/git-artifact-pages@v0.2.1
        with:
          site: ${{ matrix.site }}
          # The deployed registry decides eligibility; this config locates it.
          config: github://tasuku43/artifact-pages-admin/artifact-pages.yaml
          github-token: ${{ steps.app-token.outputs.token }}
          # Real publish on main only; pull requests and other runs are a dry-run.
          publish-on: |
            push:refs/heads/main
            workflow_dispatch:refs/heads/main
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
