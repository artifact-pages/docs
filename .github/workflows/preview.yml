# Publish pre-merge previews of pages a pull request adds or changes, for every
# site. A preview runs only for pull requests that carry the "preview-artifact"
# label and change a file under sites/, and only for pull requests from this
# repository: a fork never reaches the credentials. The existing dry-run in
# publish.yml stays; it validates the real publish, while this workflow lets the
# owner read the changed pages before merging.
#
# Preview pages are written to the production bucket under each site's
# _previews/ prefix and run like published HTML. Retention of old previews is a
# rule on the R2 side (artifact-pages/admin), not set here.
name: Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths: ['sites/**']

permissions:
  contents: read

concurrency:
  # Other labels get their own group so they cannot cancel a running preview.
  group: preview-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'preview-artifact' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  preview:
    # Same-repository pull requests that carry the "preview-artifact" label. Labeling
    # triggers a run only for that label. The admin workflow applies the same-repository
    # check before it calls the preview Action.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview-artifact') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview-artifact')
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        site: [ja]
    uses: artifact-pages/admin/.github/workflows/preview-site.yml@main
    with:
      site: ${{ matrix.site }}
      environment: preview
    secrets: inherit
