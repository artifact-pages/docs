# Publish pre-merge previews of the pages a pull request adds or changes, for
# both sites, to https://artifact-pages.dev. A preview runs only for pull
# requests that carry the "preview-artifact" label and change a file under
# sites/, and only for pull requests from this repository: a fork never reaches
# the credentials. The existing dry-run in publish.yml stays; it validates the
# real publish, while this workflow lets the owner read the changed pages
# before merging.
#
# Preview pages are written to the production bucket under each site's
# _previews/ prefix and run like published HTML. Retention of old previews is a
# rule on the R2 side (artifact-pages/admin), not set here.
name: Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    # Also applies to "labeled": a PR that changes no sites/** file never runs.
    paths: ['sites/**']

permissions:
  contents: read

concurrency:
  # Other labels get their own group so they cannot cancel a running preview.
  group: preview-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'preview-artifact' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  preview:
    # Same-repository pull requests that carry the "preview-artifact" label. Labeling
    # triggers a run only for that label. preview-publish verifies the pull
    # request again (forks, pull_request_target) before any credential is used.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview-artifact') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview-artifact')
    runs-on: ubuntu-24.04
    # Only same-repository, labeled pull requests get here; credentials live in
    # the preview environment.
    environment: preview
    permissions:
      contents: read
      pull-requests: write # PR verification and the preview comment
    strategy:
      fail-fast: false
      matrix:
        site: [guide, architecture]
    steps:
      # The action checks out the base branch itself and takes the pull request
      # number and head SHA from the event. It previews changed pages and pages
      # whose local CSS, JS or images changed; a site with nothing to preview
      # ends as no-preview, not an error. Writes one comment per site and
      # updates it on later pushes.
      - name: Preview ${{ matrix.site }}
        uses: artifact-pages/preview-action@9961a1de43f1ac7e6deb6598b9cfbed9fdab7acb # v0.1.0
        with:
          site: ${{ matrix.site }}
          # The deployed registry decides eligibility; this config locates it.
          config: github://artifact-pages/admin/artifact-pages.yaml
          comment: true
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
